  <body>

      <div class="site-header__bar">
        <nav class="site-nav" aria-label="Primary">
          <a href="privacy.html">Privacy</a>
          <a href="terms.html">Terms</a>
          <a href="support.html">Support</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero__copy">
          <h1 id="hero-title">Later</h1>
          <p>
            Save links, screenshots, notes, and reminders from anywhere. Later keeps everything private, organized, and ready when you <span class="text-nowrap">need it.</span>
          </p>
          <p class="store-cta">
            <a class="appstore-badge-link" href="https://apps.apple.com/be/app/later-save-anything/id6761394122" rel="noopener noreferrer" target="_blank" aria-label="Download Later on the App Store">
              <img src="images/badges/download-on-the-app-store.svg" width="119.66407" height="40" alt="Download on the App Store" />
            </a>
          </p>
        </div>

        <div class="hero__showcase">
          <h2 id="carousel-heading" class="visually-hidden">App highlights</h2>
          <div class="carousel" data-carousel aria-labelledby="carousel-heading">
            <div class="carousel__viewport" role="region" aria-roledescription="carousel" aria-label="Later app screenshots">
              <div class="carousel__track" tabindex="0" data-carousel-track>
                <figure class="carousel__slide">
                  <img src="images/carousel/save-links.png?v=20260513-2" width="961" height="1980" alt="Later app: save links from anywhere." loading="eager" decoding="async" />
                  <figcaption>Save links from anywhere.</figcaption>
                </figure>
                <figure class="carousel__slide">
                  <img src="images/carousel/save-and-organize.png?v=20260513-2" width="1009" height="2079" alt="Later app: save and organize an item from the share sheet." loading="lazy" decoding="async" />
                  <figcaption>Save and organize items.</figcaption>
                </figure>
                <figure class="carousel__slide">
                  <img src="images/carousel/notes-list.png?v=20260513-2" width="961" height="1980" alt="Later app: notes list with folders, reminders, and images." loading="lazy" decoding="async" />
                  <figcaption>Keep notes, links, and photos together.</figcaption>
                </figure>
                <figure class="carousel__slide">
                  <img src="images/carousel/save-screenshots.png?v=20260513-2" width="961" height="1980" alt="Later app: seamlessly save screenshots." loading="lazy" decoding="async" />
                  <figcaption>Seamlessly save screenshots.</figcaption>
                </figure>
                <figure class="carousel__slide">
                  <img src="images/carousel/add-reminders.png?v=20260513-2" width="961" height="1980" alt="Later app: add reminders to any saved item." loading="lazy" decoding="async" />
                  <figcaption>Add reminders to any item.</figcaption>

              </div>

            <div class="carousel__dots" role="tablist" aria-label="Slide selection" data-carousel-dots></div>
          </div>
        </div>

    <footer class="site-footer">

      <p style="margin-top: 0.5rem"><a href="mailto:laterapp2@gmail.com">laterapp2@gmail.com</a></p>
    </footer>

    <script>
      (function () {
        var root = document.querySelector("[data-carousel]");
        if (!root) return;
        var track = root.querySelector("[data-carousel-track]");
        var dotsHost = root.querySelector("[data-carousel-dots]");
        var slides = track ? track.querySelectorAll(".carousel__slide") : [];
        var n = slides.length;
        if (!track || n === 0) return;

        var i = 0;
        var autoTimer;
        var paused = false;

        function dotEl(index) {
          var b = document.createElement("button");
          b.type = "button";
          b.className = "carousel__dot" + (index === i ? " is-active" : "");
          b.setAttribute("role", "tab");
          b.setAttribute("aria-selected", index === i ? "true" : "false");
          b.setAttribute("aria-label", "Go to slide " + (index + 1) + " of " + n);
          b.addEventListener("click", function () {
            go(index);
          });
          return b;
        }

        function renderDots() {
          dotsHost.innerHTML = "";
          for (var d = 0; d < n; d++) dotsHost.appendChild(dotEl(d));
        }

        function targetLeftFor(index) {
          var slide = slides[index];
          if (!slide) return 0;
          return slide.offsetLeft;
        }

        function go(index) {
          i = Math.max(0, Math.min(n - 1, index));
          track.scrollTo({ left: targetLeftFor(i), behavior: "smooth" });
          Array.prototype.forEach.call(dotsHost.querySelectorAll(".carousel__dot"), function (dot, idx) {
            var on = idx === i;
            dot.classList.toggle("is-active", on);
            dot.setAttribute("aria-selected", on ? "true" : "false");
          });
        }

        function next() {
          go((i + 1) % n);
        }

        function startAuto() {
          if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
          stopAuto();
          autoTimer = window.setInterval(function () {
            if (!paused) next();
          }, 3200);
        }

        function stopAuto() {
          if (autoTimer) window.clearInterval(autoTimer);
        }

        function syncFromScroll() {
          var mid = track.scrollLeft + track.clientWidth / 2;
          var best = 0;
          var bestDist = Infinity;
          for (var s = 0; s < n; s++) {
            var el = slides[s];
            var c = el.offsetLeft + el.offsetWidth / 2;
            var dist = Math.abs(c - mid);
            if (dist < bestDist) {
              bestDist = dist;
              best = s;
            }
          }
          if (best !== i) {
            i = best;
            Array.prototype.forEach.call(dotsHost.querySelectorAll(".carousel__dot"), function (dot, idx) {
              var on = idx === i;
              dot.classList.toggle("is-active", on);
              dot.setAttribute("aria-selected", on ? "true" : "false");
            });
          }
        }

        var scrollTimer;
        track.addEventListener("scroll", function () {
          clearTimeout(scrollTimer);
          scrollTimer = setTimeout(syncFromScroll, 80);
        });

        track.addEventListener("keydown", function (e) {
          if (e.key === "ArrowLeft") {
            e.preventDefault();
            go(i - 1);
          } else if (e.key === "ArrowRight") {
            e.preventDefault();
            go(i + 1);
          }
        });

        root.addEventListener("mouseenter", function () {
          paused = true;
        });
        root.addEventListener("mouseleave", function () {
          paused = false;
        });
        root.addEventListener("focusin", function () {
          paused = true;
        });
        root.addEventListener("focusout", function () {
          paused = false;
        });

        renderDots();
        startAuto();
        window.addEventListener("resize", function () {
          go(i);
        });
      })();
    </script>
  </body>
</html>
